alerts:
  - name: high_latency_p95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: team-oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2.0 or retrieval_success_rate_pct < 90.0
    duration: 3m
    type: symptom-based
    channel: slack
    owner: team-oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: daily_cost_spike
    severity: warning
    condition: sum(cost_usd) > 2.5 or cost_rate_per_min > 0.05
    duration: 5m
    type: symptom-based
    channel: slack
    owner: team-finops
    runbook: docs/alerts.md#alert-3
